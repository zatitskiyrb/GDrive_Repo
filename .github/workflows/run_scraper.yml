name: HR Scraper

on:
  schedule:
    - cron: "0 7 * * *"  # 10:00 Helsinki (UTC+3)
  workflow_dispatch:
    inputs:
      location:
        description: "Search location (e.g. Europe, Scandinavia, Baltic)"
        default: ""
        required: false
      telegram_chat_id:
        description: "Telegram chat ID to notify on completion"
        default: ""
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCRAPER_DIR: "Practice 4 (HR scraper)/hr_scraper"
      SA_JSON_FILE: "halogen-chemist-473110-s2-fe15cd3258e4.json"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            google-api-python-client \
            google-auth \
            pydantic \
            pdfplumber \
            httpx \
            python-dotenv \
            pyyaml \
            python-jobspy \
            beautifulsoup4

      - name: Write Google Service Account JSON
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printenv SA_JSON > "$SCRAPER_DIR/$SA_JSON_FILE"

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ env.SA_JSON_FILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEARCH_LOCATION: ${{ github.event.inputs.location }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id }}
        run: cd "$SCRAPER_DIR" && python main.py
