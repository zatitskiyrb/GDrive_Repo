name: HR Scraper

on:
  schedule:
    - cron: "0 7 * * *"  # 10:00 Helsinki (UTC+3)
  workflow_dispatch:       # ручной запуск из GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            google-api-python-client \
            google-auth \
            pydantic \
            pdfplumber \
            httpx \
            python-dotenv \
            pyyaml \
            python-jobspy \
            beautifulsoup4

      - name: Write Google Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' \
            > "Practice 4 (HR scraper)/hr_scraper/halogen-chemist-473110-s2-fe15cd3258e4.json"

      - name: Run scraper
        working-directory: "Practice 4 (HR scraper)/hr_scraper"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: "halogen-chemist-473110-s2-fe15cd3258e4.json"
        run: python main.py
