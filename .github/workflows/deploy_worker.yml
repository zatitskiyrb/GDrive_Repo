name: Deploy Cloudflare Worker

on:
  push:
    paths:
      - "Practice 4 (HR scraper)/bot/worker.js"
      - "Practice 4 (HR scraper)/bot/wrangler.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "Practice 4 (HR scraper)/bot"
